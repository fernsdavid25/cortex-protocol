# Dependabot runs for ONE thing: the full-SHA action pins in .github/workflows/*.
#
# Pinning actions to a SHA is what makes the CI supply chain safe, and it is also what stops
# them from ever updating on their own — so something has to bump them, and this is it.
#
# There is deliberately NO `pip` block. The lint job already runs `pip-audit` over the exported
# lockfile on every push, which is what actually caught PYSEC-2026-3455/3456/3457 in pyasn1;
# a weekly PR that bumps Python deps on top of that is a second opinion nobody reads.
#
# Monthly, not weekly: three action pins across three workflows do not change often enough to
# be worth a PR every Monday.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
